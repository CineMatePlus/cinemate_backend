[project]
name = "cinemate"
version = "0.1.0"
description = "FastAPI backend for the CineMate movie and series tracking application"
authors = [{ name = "Muhammet Berk", email = "muhammetberk561@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "starlette (>=1.3.1,<2.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "click (>=8.3.3,<9.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "PyJWT (>=2.13.0,<3.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "python-multipart (>=0.0.32,<0.1.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "idna (>=3.15,<4.0)",
    "urllib3 (>=2.7.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^9.0.0"
pip-audit = "^2.10.1"
msgpack = ">=1.2.1,<2.0.0"

[tool.poetry.group.test.dependencies]
behave = "^1.3.3"
allure-behave = "^2.16.0"
coverage = "^7.15.4"
requests = "^2.34.2"

[tool.poetry.group.performance]
optional = true

[tool.poetry.group.performance.dependencies]
locust = ">=2.37.11,<2.46.0"

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py312"]

[tool.poetry]
package-mode = false
