name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/app-readiness']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: pip install "poetry==${POETRY_VERSION}"
      - run: poetry install --with dev
      - run: poetry check --lock
      - run: poetry run black --check app scripts tests
      - run: poetry run isort --check-only app scripts tests
      - run: poetry run python -m compileall -q app scripts tests
      - run: poetry run python scripts/verify_seed.py
      - name: Generate OpenAPI schema
        run: poetry run python -c "import json; from app.main import app; json.dump(app.openapi(), open('/tmp/openapi.json', 'w'))"

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: pip install "poetry==${POETRY_VERSION}"
      - run: poetry install --with test
      - run: poetry run coverage run --source=app -m unittest discover -s tests/unit -v
      - run: poetry run coverage xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: integration
    runs-on: ubuntu-latest
    env:
      MONGODB_URL: mongodb://localhost:27018/?directConnection=true
      MONGODB_DB: cinemate_ci
      TEST_MONGODB_URL: mongodb://localhost:27018/?directConnection=true
      VECTOR_SEARCH_STARTUP_CHECK: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: pip install "poetry==${POETRY_VERSION}"
      - run: poetry install --with test
      - run: docker compose up -d --wait mongodb
      - run: docker compose run --rm index-init
      - run: poetry run behave tests/features
      - name: Start the containerized API and verify auth sessions
        run: |
          docker compose up -d --wait backend
          poetry run python tests/integration/auth_smoke.py
      - name: Seed twice without Ollama and verify idempotency
        run: |
          poetry run python scripts/seed_movies.py --skip-embeddings
          poetry run python scripts/seed_movies.py --skip-embeddings
          poetry run python -c "import os; from pymongo import MongoClient; c=MongoClient(os.environ['MONGODB_URL']); assert c[os.environ['MONGODB_DB']].movies.count_documents({}) == 999; c.close()"
      - run: poetry run python scripts/vector_search_smoke.py
      - name: Product ownership and concurrent writes
        env:
          TEST_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: poetry run python tests/integration/product_smoke.py
      - name: Verify MongoDB volume persistence after restart
        run: |
          docker compose restart mongodb
          docker compose up -d --wait mongodb backend
          poetry run python -c "import os; from pymongo import MongoClient; c=MongoClient(os.environ['MONGODB_URL']); assert c[os.environ['MONGODB_DB']].movies.count_documents({}) == 999; c.close()"
      - name: Compose diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop integration services
        if: always()
        run: docker compose down -v

  container-security:
    name: container-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: github/codeql-action/init@0b1f0509b2ddb4dc7bd94367abfe7ad1d8a1b810 # v3.30.5
        with:
          languages: python
      - run: pip install "poetry==${POETRY_VERSION}" "poetry-plugin-export==1.10.0" "pip-audit==2.10.1"
      - name: Audit production dependencies
        run: |
          poetry export --only main --without-hashes --output /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --gitleaks-ignore-path=/repo/.gitleaksignore --no-banner --redact
      - run: docker compose build backend
      - run: docker compose up -d --wait
      - run: curl --fail --retry 5 http://localhost:8000/health/live
      - run: curl --fail --retry 5 http://localhost:8000/health/ready
      - uses: github/codeql-action/analyze@0b1f0509b2ddb4dc7bd94367abfe7ad1d8a1b810 # v3.30.5
      - name: Compose diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop smoke services
        if: always()
        run: docker compose down -v
