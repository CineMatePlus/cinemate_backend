services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cinemate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Atlas Local ayrı Compose projesinde host'un 27018 portuna açılır.
      MONGODB_URL: ${DOCKER_MONGODB_URL:-mongodb://host.docker.internal:27018/?directConnection=true}
      TEST_MONGODB_URL: ${DOCKER_TEST_MONGODB_URL:-mongodb://host.docker.internal:27018/?directConnection=true}
      # Ollama native olarak host işletim sisteminde çalışmaya devam eder.
      EMBEDDING_BASE_URL: ${DOCKER_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
